<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow — Full Stack</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><section id="auth" class="card auth"><div class="brand">TASK<span>FLOW</span></div><p class="eyebrow">FULL-STACK PRODUCTIVITY</p><h1>Plan clearly.<br><span>Ship consistently.</span></h1><div class="tabs"><button class="tab active" data-mode="login">Sign in</button><button class="tab" data-mode="register">Create account</button></div><form id="authForm"><input id="name" placeholder="Your name" autocomplete="name" hidden><input id="email" type="email" placeholder="Email" autocomplete="email" required><input id="password" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" required><button class="primary" type="submit" id="authSubmit">Sign in</button><p id="authMsg" class="msg"></p></form></section><section id="app" class="app" hidden><header><div><p class="eyebrow">PERSONAL WORKSPACE</p><h2>Good to see you, <span id="userName"></span>.</h2></div><button id="logout" class="ghost">Sign out</button></header><div class="stats"><div><small>TOTAL</small><strong id="total">0</strong></div><div><small>DONE</small><strong id="done">0</strong></div><div><small>PROGRESS</small><strong id="progress">0%</strong></div></div><form id="taskForm" class="add"><input id="taskTitle" maxlength="120" placeholder="What needs to be done?" required><select id="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select><button class="primary">Add task</button></form><div class="list-head"><h3>Tasks</h3><button id="refresh" class="ghost">Refresh</button></div><div id="tasks" class="tasks"></div><p id="appMsg" class="msg"></p></section></main><script src="/app.js"></script></body></html>
