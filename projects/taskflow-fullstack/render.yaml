services:
  - type: web
    name: taskflow-fullstack
    runtime: node
    rootDir: projects/taskflow-fullstack
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/taskflow.db
    disk:
      name: taskflow-data
      mountPath: /var/data
      sizeGB: 1
